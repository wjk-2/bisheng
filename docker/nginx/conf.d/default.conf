
# 在http区域内一定要添加下面配置, 支持websocket
map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}



server {
	gzip on;
	gzip_comp_level  6;
	gzip_min_length  1000;
	gzip_types  text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
	gzip_http_version 1.1;
	gzip_vary  on;
	gzip_disable "MSIE [4-6] \.";

	listen 3001;

	# Security headers
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-XSS-Protection "1; mode=block" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

	# /workspace 不带斜杠修复
	rewrite ^/workspace$ /workspace/ redirect;

	location / {
		root /usr/share/nginx/html/platform;
		index index.html index.htm;
		# 禁止浏览器缓存 index.html
		location = /index.html {
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
			add_header Pragma "no-cache" always;
			add_header Expires 0 always;
		}
		# 带 hash 静态资源 - 长期缓存（文件名含 hash，内容变化自动换文件名）
		location /assets/js/ {
			expires 1y;
			add_header Cache-Control "public, immutable" always;
			add_header X-Content-Type-Options "nosniff" always;
			add_header X-Frame-Options SAMEORIGIN;
			access_log off;
		}
		location /assets/css/ {
			expires 1y;
			add_header Cache-Control "public, immutable" always;
			add_header X-Content-Type-Options "nosniff" always;
			add_header X-Frame-Options SAMEORIGIN;
			access_log off;
		}
		try_files $uri $uri/ /index.html =404;
		add_header X-Frame-Options SAMEORIGIN;
	}

	location /workspace/ {
		alias /usr/share/nginx/html/client/;
		index index.html index.htm;
		# 禁止浏览器缓存 /workspace/index.html
		location = /workspace/index.html {
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
			add_header Pragma "no-cache" always;
			add_header Expires 0 always;
		}
		# SW 相关文件强制 no-cache（无 hash，必须每次验证）
		location ~* ^/workspace/(sw\.js|workbox-[^/]+\.js|registerSW\.js)$ {
			add_header Cache-Control "no-store, no-cache, must-revalidate" always;
			add_header Pragma "no-cache" always;
			add_header Expires 0 always;
		}
		# 带 hash 静态资源 - 长期缓存
		location /workspace/assets/ {
			expires 1y;
			add_header Cache-Control "public, immutable" always;
			add_header X-Content-Type-Options "nosniff" always;
			access_log off;
		}
		try_files $uri $uri/ /workspace/index.html;
	}

	location ~ ^(/workspace)?/api(/|$) {
		rewrite ^/workspace(/.*)$ $1 break;
		proxy_pass http://backend:7860;
		proxy_read_timeout 300s;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		client_max_body_size 200m;
		add_header X-Frame-Options SAMEORIGIN;
	}

	location ~ ^(/workspace)?/eagent|/tmp-dir {
		rewrite ^/workspace(/.*)$ $1 break;
		proxy_pass http://minio:9000;
	}
}