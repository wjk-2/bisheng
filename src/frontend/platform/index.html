<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="svg" href="/favicon.svg" /> -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <%- aceScriptSrc %>
    <title>E-Agent</title>
    <!-- style -->
    <link rel="stylesheet" href="/src/pages/LoginPage/loginv2.css" />
    <style>
      body { color: #e2e8f0; height: 100vh; margin: 0; }
    </style>
    <script>
      (function() {
        // 防首屏 FOUC：dark 模式下提前给 <html> 加 .dark class，
        // 让 Tailwind dark: 变体与 React 挂载后的 darkContext 一致，避免组件层以 light 渲染后再切换造成的闪烁
        var theme = window.localStorage.getItem('theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          if (document.body) document.body.style.backgroundColor = '#020617';
        } else {
          if (document.body) document.body.style.backgroundColor = '#ffffff';
        }
      })();
    </script>
    <script>
        (function() {
          var mode = localStorage.getItem('theme') || 'light';
          if (mode !== 'dark') mode = 'light';

          function injectThemeVars(comp, mode) {
            var rules = '';
            var keys = Object.keys(comp);
            for (var i = 0; i < keys.length; i++) {
              var key = keys[i];
              var hsl = comp[key];
              rules += key + ':' + hsl.h + ' ' + (hsl.s * 100) + '% ' + (hsl.l * 100) + '%;';
            }
            var selector = mode === 'dark' ? '.dark' : ':root';
            var style = document.getElementById('theme-vars');
            if (!style) {
              style = document.createElement('style');
              style.id = 'theme-vars';
              document.head.appendChild(style);
            }
            style.innerHTML = selector + '{' + rules + '}';
          }

          window.__injectThemeVars = injectThemeVars;

          fetch('<%- baseUrl %>/api/v1/web/config').then(function(res) {
            return res.json();
          }).then(function(res) {
            var raw = res.data ? res.data.value : '';
            var parsed = {};
            try { if (raw) parsed = JSON.parse(raw); } catch(e) {}
            var themeVal;
            if (parsed.light) {
              themeVal = { light: parsed.light || {}, dark: parsed.dark || {}, bg: parsed.bg || '' };
            } else if (parsed.comp) {
              themeVal = { light: parsed.comp, dark: {}, bg: parsed.bg || '' };
            } else {
              themeVal = { light: {}, dark: {}, bg: '' };
            }
            window.ThemeStyle = themeVal;
            injectThemeVars(themeVal[mode] || {}, mode);
          }).catch(function() {
            window.ThemeStyle = { light: {}, dark: {}, bg: '' };
          });
        })();
    </script>
</head>

<body id='body' style="width: 100%; height:100%">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div style="width: 100vw; height:100vh" id='root'></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
<script>
    // 触摸板禁止手指缩放
    document.addEventListener('wheel', function (event) {
        if (event.ctrlKey) {
            event.preventDefault()
        }
    }, {
        passive: false
    })
</script>

</html>
