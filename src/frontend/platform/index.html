<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="svg" href="/favicon.svg" /> -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <%- aceScriptSrc %>
    <title>E-Agent</title>
    <!-- style -->
    <link rel="stylesheet" href="/src/pages/LoginPage/loginv2.css" />
    <style>
      body { color: #e2e8f0; height: 100vh; margin: 0; }
    </style>
    <script>
      (function() {
        // 防首屏 FOUC：dark 模式下提前给 <html> 加 .dark class，
        // 让 Tailwind dark: 变体与 React 挂载后的 darkContext 一致，避免组件层以 light 渲染后再切换造成的闪烁
        var theme = window.localStorage.getItem('theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          if (document.body) document.body.style.backgroundColor = '#020617';
        } else {
          if (document.body) document.body.style.backgroundColor = '#ffffff';
        }
      })();
    </script>
    <!-- 主题双 style（light/dark 派生令牌）+ window.ThemeStyle + version 同步初值 由
         @shared/theme/inlineThemePlugin 在 build-time 通过 transformIndexHtml 注入（见 vite.config.mts plugins）。
         首屏不再 fetch 后端 web_config，主题令牌由 DEFAULT_BRAND 学术蓝派生（22 个）固化进 HTML。 -->

</head>

<body id='body' style="width: 100%; height:100%">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div style="width: 100vw; height:100vh" id='root'></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
<script>
    // 触摸板禁止手指缩放
    document.addEventListener('wheel', function (event) {
        if (event.ctrlKey) {
            event.preventDefault()
        }
    }, {
        passive: false
    })
</script>

</html>
