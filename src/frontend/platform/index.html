<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="svg" href="/favicon.svg" /> -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <%- aceScriptSrc %>
    <title>E-Agent</title>
    <!-- style -->
    <link rel="stylesheet" href="/src/pages/LoginPage/loginv2.css" />
    <style>
      body { color: #e2e8f0; height: 100vh; margin: 0; }
    </style>
    <script>
      (function() {
        // 防首屏 FOUC：dark 模式下提前给 <html> 加 .dark class，
        // 让 Tailwind dark: 变体与 React 挂载后的 darkContext 一致，避免组件层以 light 渲染后再切换造成的闪烁
        var theme = window.localStorage.getItem('theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          if (document.body) document.body.style.backgroundColor = '#020617';
        } else {
          if (document.body) document.body.style.backgroundColor = '#ffffff';
        }
      })();
    </script>
    <script>
        // bootstrap（React 挂载前）内联主题变量：双 style 常驻，与 themeRuntime.applyLight/applyDark 对齐。
        //   - #theme-vars-light → :root{...light comp...}
        //   - #theme-vars-dark  → .dark{...dark comp...}
        // 两 style 都创建常驻；首屏正确（消除 FOUC），运行时 theme/index.tsx 复用同两节点（C5 diff 生效）。
        // 注：本段是内联脚本（React 前，不能 import themeRuntime/themeConfig），注入逻辑为纯 JS 内联副本，
        //     制式与 formatCssRules 一致（key 白名单 ^--[a-z-]+$；h∈[0,360]；s/l∈[0,1] ×100）。
        //     阶段3 build-time 内联会消除该副本。
        (function() {
          // CSS 变量 key 白名单（与 themeRuntime.KEY_RE 一致），防 CSS 注入
          var KEY_RE = /^--[a-z-]+$/;

          function formatRules(comp) {
            var rules = '';
            var keys = Object.keys(comp);
            for (var i = 0; i < keys.length; i++) {
              var key = keys[i];
              if (!KEY_RE.test(key)) continue;
              var hsl = comp[key];
              if (!hsl || typeof hsl.h !== 'number' || typeof hsl.s !== 'number' || typeof hsl.l !== 'number') continue;
              if (!(hsl.h >= 0 && hsl.h <= 360)) continue;
              if (!(hsl.s >= 0 && hsl.s <= 1)) continue;
              if (!(hsl.l >= 0 && hsl.l <= 1)) continue;
              rules += key + ':' + hsl.h + ' ' + (hsl.s * 100) + '% ' + (hsl.l * 100) + '%;';
            }
            return rules;
          }

          function writeStyle(id, selector, comp) {
            var style = document.getElementById(id);
            if (!style) {
              style = document.createElement('style');
              style.id = id;
              document.head.appendChild(style);
            }
            var content = selector + '{' + formatRules(comp) + '}';
            // C5 diff：内容相同则不重写（避免 innerHTML 重置 → 浏览器重算 → 闪烁）
            if (style.innerHTML === content) return;
            style.innerHTML = content;
          }

          fetch('<%- baseUrl %>/api/v1/web/config').then(function(res) {
            return res.json();
          }).then(function(res) {
            var raw = res.data ? res.data.value : '';
            var parsed = {};
            try { if (raw) parsed = JSON.parse(raw); } catch(e) {}
            var themeVal;
            if (parsed.light) {
              themeVal = { light: parsed.light || {}, dark: parsed.dark || {}, bg: parsed.bg || '' };
            } else if (parsed.comp) {
              // v1 兼容：comp → light，dark 留空（让 CSS index.css 默认兜底）
              themeVal = { light: parsed.comp, dark: {}, bg: parsed.bg || '' };
            } else {
              themeVal = { light: {}, dark: {}, bg: '' };
            }
            window.ThemeStyle = themeVal;
            // 双 style 常驻：light 永远写 :root，dark 永远写 .dark（与运行时 themeRuntime 对齐）
            writeStyle('theme-vars-light', ':root', themeVal.light || {});
            writeStyle('theme-vars-dark', '.dark', themeVal.dark || {});
            // version 方案 B：塞全局变量供 theme/index.tsx 同步读 versionRef 初值，消除 getCurrentVersion 异步窗口（竞态）
            if (typeof parsed.version === 'number') {
              window.__themeVersion = parsed.version;
            }
          }).catch(function() {
            window.ThemeStyle = { light: {}, dark: {}, bg: '' };
            // fetch 失败：写空 style（CSS index.css 默认兜底，与现状一致）
            writeStyle('theme-vars-light', ':root', {});
            writeStyle('theme-vars-dark', '.dark', {});
          });
        })();
    </script>
</head>

<body id='body' style="width: 100%; height:100%">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div style="width: 100vw; height:100vh" id='root'></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
<script>
    // 触摸板禁止手指缩放
    document.addEventListener('wheel', function (event) {
        if (event.ctrlKey) {
            event.preventDefault()
        }
    }, {
        passive: false
    })
</script>

</html>
